<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="petroleo_grad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#006666" />
      <stop offset="50%" stop-color="#008B8B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="glow_grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#004D4D" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#004D40" flood-opacity="0.5" />
    </filter>
  </defs>
  <rect x="4" y="4" width="40" height="40" rx="12" fill="#091819" stroke="url(#petroleo_grad)" stroke-width="2" filter="url(#shadow)" />
  
  <!-- Intersecting Nodes / Hub Shape -->
  <circle cx="16" cy="18" r="5" fill="#008B8B" stroke="#2DD4BF" stroke-width="1.5" />
  <circle cx="32" cy="18" r="5" fill="#0D5C5B" stroke="#10B981" stroke-width="1.5" />
  <circle cx="24" cy="32" r="6" fill="#004D40" stroke="#2DD4BF" stroke-width="2" />
  
  <!-- Connecting Reconciliation Lines -->
  <path d="M19.5 21.5L22 27" stroke="url(#petroleo_grad)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M28.5 21.5L26 27" stroke="url(#petroleo_grad)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M20 18H28" stroke="#10B981" stroke-width="2" stroke-dasharray="2 2" stroke-linecap="round" />
  
  <!-- Central Glow / Checkmark pulse -->
  <circle cx="24" cy="32" r="2.5" fill="#10B981" />
</svg>
